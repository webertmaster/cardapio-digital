<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App do Entregador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14251C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --ink:#14251C; --ink-soft:#2A3F32; --paper:#F5F4EF; --card:#FFFFFF;
    --accent:#FF5A36; --line:#E7E3D8; --muted:#8B8B80; --success:#2E8B57; --danger:#C24D3A;
    font-family:'Inter',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);padding-bottom:30px;}
  h1,h2,h3{font-family:'Poppins',sans-serif;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .hide{display:none !important;}

  /* LOGIN */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--card);padding:28px 24px;border-radius:20px;width:100%;max-width:360px;border:1px solid var(--line);}
  .login-box h1{font-size:19px;margin-bottom:4px;}
  .login-box p{font-size:12.5px;color:var(--muted);margin-bottom:20px;}
  .campo{margin-bottom:12px;}
  .campo label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .campo input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;background:var(--paper);font-family:inherit;}
  .btn-primario{width:100%;background:var(--ink);color:#fff;padding:13px;border-radius:12px;font-size:14px;font-weight:700;margin-top:6px;}
  .btn-secundario{width:100%;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:12px;border-radius:12px;font-size:13.5px;font-weight:600;margin-top:8px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;}
  .erro{color:var(--danger);font-size:12.5px;margin-top:8px;}

  /* HEADER */
  header.entregador{background:var(--ink);color:#fff;padding:16px 18px;position:relative;}
  header.entregador h1{font-size:16px;}
  .btn-sair{position:absolute;top:16px;right:18px;background:rgba(255,255,255,0.12);color:#fff;
    font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:100px;}
  header.entregador p{font-size:12px;color:#C9D6CC;margin-top:2px;}
  .status-rastreio{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#C9D6CC;margin-top:8px;}
  .status-rastreio .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  .status-rastreio .dot.off{background:var(--danger);}

  .btn-disponibilidade{width:100%;margin-top:12px;padding:12px;border-radius:12px;font-size:13.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;}
  .btn-disponibilidade .dot{width:8px;height:8px;border-radius:50%;background:#fff;}
  .btn-disponibilidade.online{background:var(--success);color:#fff;}
  .btn-disponibilidade.offline{background:rgba(255,255,255,0.14);color:#fff;}

  main{padding:16px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;}

  /* CARD DE PEDIDO */
  .pedido-entrega-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--line);border-left:4px solid var(--accent);}
  .pedido-entrega-card .linha1{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:4px;}
  .pedido-entrega-card .linha2{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .pedido-entrega-card .linha3{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .pedido-entrega-card .tag-status{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;margin-top:8px;background:#FFF1D9;color:#B4690E;}
  .pedido-entrega-card .tag-status.pronto{background:#E4EDFB;color:#1D4ED8;}
  .pedido-entrega-card .tag-status.aguardando{background:#EFEFEF;color:#767676;}
  .pedido-entrega-card .acoes{display:flex;gap:8px;margin-top:12px;}
  .pedido-entrega-card .acoes button{flex:1;padding:11px;border-radius:11px;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .btn-rota{background:#E4EDFB;color:#1D4ED8;}
  .btn-retirei{background:#FFF1D9;color:#B4690E;}
  .btn-entregue{background:var(--success);color:#fff;}

  .entregas-hoje{font-size:11.5px;color:#C9D6CC;margin-top:8px;}
  .link-whatsapp-loja{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:11px;
    border-radius:12px;background:rgba(255,255,255,0.14);color:#fff;font-size:13px;font-weight:600;text-decoration:none;}

  /* ROTA COM MÚLTIPLAS ENTREGAS */
  .check-rota{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:10px;}
  .btn-planejar-rota{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;background:var(--ink);color:#fff;
    padding:14px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;gap:8px;}

  #modalRota{position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;flex-direction:column;}
  #modalRota .modal-header{background:var(--ink);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;}
  #modalRota .modal-header h2{font-size:16px;}
  #modalRota .btn-fechar-modal{background:rgba(255,255,255,0.14);color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px;}
  #mapaRota{height:38vh;flex-shrink:0;}
  #listaRotaOrdenada{flex:1;overflow-y:auto;padding:14px 16px;}
  .parada-rota{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
  .parada-rota .numero{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .parada-rota .info strong{font-size:13px;display:block;}
  .parada-rota .info span{font-size:12px;color:var(--muted);}
  .marcador-numerado{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);}
  #modalRota .rodape{padding:14px 16px;border-top:1px solid var(--line);background:var(--card);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="telaLogin">
  <div class="login-box">
    <h1>App do Entregador</h1>
    <p>Entre com o PIN cadastrado pela loja.</p>
    <div class="campo"><label>Loja</label><input id="loginSlug" placeholder="Ex: minha-lanchonete"></div>
    <div class="campo"><label>PIN</label><input id="loginPin" inputmode="numeric" placeholder="0000"></div>
    <button class="btn-primario" onclick="fazerLogin()">Entrar</button>
    <div class="erro hide" id="loginErro"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header class="entregador">
    <button class="btn-sair" onclick="sair()">Sair</button>
    <h1 id="nomeEntregador">Olá!</h1>
    <p id="nomeLoja">—</p>
    <div class="status-rastreio"><span class="dot off" id="dotRastreio"></span><span id="textoRastreio">Ativando localização…</span></div>
    <p class="entregas-hoje" id="textoEntregasHoje">0 entregas hoje</p>
    <button class="btn-disponibilidade" id="btnDisponibilidade" onclick="alternarDisponibilidade()">
      <span class="dot"></span><span id="textoDisponibilidade">Carregando…</span>
    </button>
    <a href="#" target="_blank" rel="noopener" class="link-whatsapp-loja hide" id="linkWhatsappLoja">💬 Falar com a loja</a>
  </header>
  <main>
    <div id="listaPedidosEntregador"></div>
  </main>
  <button class="btn-planejar-rota hide" id="btnPlanejarRota" onclick="abrirModalRota()">🧭 <span id="textoPlanejarRota">Planejar rota</span></button>
</div>

<!-- ROTA COM MÚLTIPLAS ENTREGAS -->
<div id="modalRota" class="hide">
  <div class="modal-header">
    <h2>Sua rota</h2>
    <button class="btn-fechar-modal" onclick="fecharModalRota()">✕</button>
  </div>
  <div id="mapaRota"></div>
  <div id="listaRotaOrdenada"></div>
  <div class="rodape">
    <button class="btn-primario" onclick="iniciarRotaGoogleMaps()">Abrir rota no Google Maps</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
